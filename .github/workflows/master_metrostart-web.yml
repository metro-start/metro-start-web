# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - metrostart-web

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v6

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        shell: bash
        run: dotnet test metro-start-web.sln --configuration Release

      - name: Publish
        shell: bash
        run: dotnet publish metro-start-web.csproj --configuration Release --output ./output
      
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_44BEBEB4367A4970B0313854DD8D7C7D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8A6A56942C8C4F38916EC792422EC7D8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CD85284D3F094F98A47AB4DCAA11CA52 }}

      - name: Configure Azure Functions runtime
        shell: bash
        run: az resource update --resource-group metrostart --name metrostart-web --resource-type Microsoft.Web/sites --api-version 2024-04-01 --set properties.functionAppConfig.runtime.name=dotnet-isolated properties.functionAppConfig.runtime.version=10.0 --output none

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'metrostart-web'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'

      - name: Smoke test production health
        shell: bash
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 20 https://api.metro-start.com/api/health
